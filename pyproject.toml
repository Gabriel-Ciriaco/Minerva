[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "minerva"
version = "0.1.0"
description = "Tutor local de disciplina: busca citada nos materiais do aluno via MCP"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "pypdf==6.21.4",
    "python-pptx==1.0.2",
    "mcp==2.3.0",
    "pyyaml>=6",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
minerva = "minerva.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
minerva = ["templates/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
